name: springboard-probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ensure iOS 18 runtime
        run: bash scripts/ensure_ios18.sh
      - name: Probe SpringBoard animations
        run: bash scripts/probe_springboard.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: springboard-probe
          path: artifacts/springboard
