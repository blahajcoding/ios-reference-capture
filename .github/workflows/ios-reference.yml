name: ios-reference
on:
  workflow_dispatch:
    inputs:
      springboard_probe:
        description: Run experimental SpringBoard probe instead of UIKit capture
        type: boolean
        default: false
      system_ui:
        description: Capture iPadOS system UI instead of the UIKit demo
        type: boolean
        default: false

jobs:
  capture:
    if: ${{ !inputs.springboard_probe && !inputs.system_ui }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [iphone, ipad]
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate capture checks
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Tool versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          ls /Applications | grep -i xcode || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Ensure an iOS 18 simulator runtime
        run: bash scripts/ensure_ios18.sh

      - name: Build app
        run: |
          xcodegen generate
          xcodebuild -project RefApp.xcodeproj -scheme RefApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Capture (screenshots, video, JSON dumps)
        run: bash scripts/capture.sh

      - name: Compare phone capture with verified tokens
        if: matrix.profile == 'iphone'
        run: python3 -B scripts/check_tokens.py ios18-tokens.json artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile == 'iphone' && 'ios18-reference' || 'ipados18-reference' }}
          path: artifacts

  springboard-probe:
    if: ${{ inputs.springboard_probe && !inputs.system_ui }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ensure iOS 18 runtime
        run: bash scripts/ensure_ios18.sh
      - name: Probe SpringBoard animations
        run: bash scripts/probe_springboard.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: springboard-probe
          path: artifacts/springboard

  system-ui:
    if: ${{ inputs.system_ui }}
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [light, dark]
    env:
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Ensure iOS 18 runtime
        run: bash scripts/ensure_ios18.sh
      - name: Capture system UI
        run: bash scripts/capture_system_ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipados18-system-ui-${{ matrix.mode }}
          path: artifacts/system-ui
