name: ios-reference
on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          ls /Applications | grep -i xcode || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Ensure an iOS 18 simulator runtime
        run: bash scripts/ensure_ios18.sh

      - name: Build app
        run: |
          xcodegen generate
          xcodebuild -project RefApp.xcodeproj -scheme RefApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Capture (screenshots, video, JSON dumps)
        run: bash scripts/capture.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ios18-reference
          path: artifacts
